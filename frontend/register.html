<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PDF Practice Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .auth-body {
            padding: 40px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .password-input {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #374151;
        }

        .exam-selection {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .exam-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .exam-option {
            padding: 8px 16px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .exam-option:hover {
            background: #e5e7eb;
        }

        .exam-option.selected {
            background: #059669;
            color: white;
            border-color: #059669;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .terms input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #059669;
        }

        .terms a {
            color: #059669;
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .auth-btn {
            padding: 16px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
        }

        .auth-btn.loading {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .auth-footer {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 25px;
        }

        .auth-footer a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .auth-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .auth-links a:hover {
            color: #059669;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            justify-content: center;
        }

        .logo i {
            font-size: 2rem;
        }

        .strength-meter {
            margin-top: 5px;
        }

        .strength-bars {
            display: flex;
            gap: 3px;
            margin-top: 5px;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            background: #e5e7eb;
            border-radius: 2px;
        }

        .strength-bar.active {
            background: #059669;
        }

        .strength-bar.medium {
            background: #f59e0b;
        }

        .strength-bar.strong {
            background: #059669;
        }

        .strength-bar.weak {
            background: #dc2626;
        }

        .strength-text {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .auth-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF Practice Pro</span>
                </div>
                <h1>Create Account</h1>
                <p>Start your exam preparation journey</p>
            </div>

            <div class="auth-body">
                <form class="auth-form" id="register-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" 
                                   id="name" 
                                   class="form-control" 
                                   placeholder="Enter your full name"
                                   required>
                            <div class="error-message" id="name-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" 
                                   id="email" 
                                   class="form-control" 
                                   placeholder="Enter your email"
                                   required>
                            <div class="error-message" id="email-error"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input">
                                <input type="password" 
                                       id="password" 
                                       class="form-control" 
                                       placeholder="Create a password"
                                       required>
                                <button type="button" class="toggle-password" id="toggle-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="strength-meter">
                                <div class="strength-bars" id="strength-bars">
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                </div>
                                <div class="strength-text" id="strength-text"></div>
                            </div>
                            <div class="error-message" id="password-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <div class="password-input">
                                <input type="password" 
                                       id="confirm-password" 
                                       class="form-control" 
                                       placeholder="Confirm your password"
                                       required>
                                <button type="button" class="toggle-password" id="toggle-confirm-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="error-message" id="confirm-password-error"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Select Your Exams (Optional)</label>
                        <div class="exam-selection">
                            <div class="exam-options" id="exam-options">
                                <div class="exam-option" data-exam="upsc">UPSC</div>
                                <div class="exam-option" data-exam="ssc">SSC</div>
                                <div class="exam-option" data-exam="jee">JEE</div>
                                <div class="exam-option" data-exam="neet">NEET</div>
                                <div class="exam-option" data-exam="banking">Banking</div>
                                <div class="exam-option" data-exam="cat">CAT</div>
                                <div class="exam-option" data-exam="gate">GATE</div>
                                <div class="exam-option" data-exam="other">Other</div>
                            </div>
                            <input type="hidden" id="selected-exams">
                        </div>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>
                        </label>
                    </div>
                    <div class="error-message" id="terms-error"></div>

                    <button type="submit" class="auth-btn" id="register-btn">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>

                    <div class="auth-footer">
                        Already have an account?
                        <a href="login.html">Sign in now</a>
                    </div>
                </form>

                <div class="auth-links">
                    <a href="index.html">Back to Home</a>
                    <a href="help.html">Need Help?</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const registerForm = document.getElementById('register-form');
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');
            const registerBtn = document.getElementById('register-btn');
            const examOptions = document.querySelectorAll('.exam-option');
            const selectedExamsInput = document.getElementById('selected-exams');
            const strengthBars = document.getElementById('strength-bars');
            const strengthText = document.getElementById('strength-text');
            const termsCheckbox = document.getElementById('terms');

            // Check if user is already logged in
            if (PDFPracticePro.isAuthenticated()) {
                window.location.href = 'dashboard.html';
            }

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });

            toggleConfirmPasswordBtn.addEventListener('click', function() {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });

            // Password strength checker
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                const strength = checkPasswordStrength(password);
                updateStrengthMeter(strength);
            });

            // Exam selection
            examOptions.forEach(option => {
                option.addEventListener('click', function() {
                    this.classList.toggle('selected');
                    updateSelectedExams();
                });
            });

            // Form submission
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Validate form
                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const termsAccepted = termsCheckbox.checked;
                const exams = selectedExamsInput.value ? selectedExamsInput.value.split(',') : [];

                let isValid = true;

                // Clear previous errors
                clearAllErrors();

                // Validate name
                if (!name) {
                    showError('name-error', 'Full name is required');
                    isValid = false;
                }

                // Validate email
                if (!email) {
                    showError('email-error', 'Email is required');
                    isValid = false;
                } else if (!isValidEmail(email)) {
                    showError('email-error', 'Please enter a valid email address');
                    isValid = false;
                }

                // Validate password
                if (!password) {
                    showError('password-error', 'Password is required');
                    isValid = false;
                } else if (password.length < 6) {
                    showError('password-error', 'Password must be at least 6 characters');
                    isValid = false;
                } else if (checkPasswordStrength(password).score < 2) {
                    showError('password-error', 'Please choose a stronger password');
                    isValid = false;
                }

                // Validate confirm password
                if (!confirmPassword) {
                    showError('confirm-password-error', 'Please confirm your password');
                    isValid = false;
                } else if (password !== confirmPassword) {
                    showError('confirm-password-error', 'Passwords do not match');
                    isValid = false;
                }

                // Validate terms
                if (!termsAccepted) {
                    showError('terms-error', 'You must agree to the terms and conditions');
                    isValid = false;
                }

                if (!isValid) return;

                // Disable button and show loading
                registerBtn.disabled = true;
                registerBtn.classList.add('loading');
                registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

                try {
                    // Call registration API
                    const response = await PDFPracticePro.makeRequest('/auth/register', 'POST', {
                        name: name,
                        email: email,
                        password: password,
                        exams: exams
                    });

                    if (response && response.success) {
                        // Save token and user data
                        localStorage.setItem('auth_token', response.token);
                        localStorage.setItem('user_data', JSON.stringify(response.user));

                        // Show success message
                        PDFPracticePro.showNotification('Account created successfully!', 'success');

                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    }
                } catch (error) {
                    // Show error message
                    if (error.message.includes('already exists')) {
                        showError('email-error', 'An account with this email already exists');
                    } else {
                        PDFPracticePro.showNotification(error.message || 'Registration failed', 'error');
                    }
                    
                    // Reset button
                    registerBtn.disabled = false;
                    registerBtn.classList.remove('loading');
                    registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            });

            // Helper functions
            function showError(elementId, message) {
                const element = document.getElementById(elementId);
                element.textContent = message;
                element.classList.add('show');
            }

            function clearError(elementId) {
                const element = document.getElementById(elementId);
                element.textContent = '';
                element.classList.remove('show');
            }

            function clearAllErrors() {
                clearError('name-error');
                clearError('email-error');
                clearError('password-error');
                clearError('confirm-password-error');
                clearError('terms-error');
            }

            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            function checkPasswordStrength(password) {
                let score = 0;
                let feedback = '';

                // Length check
                if (password.length >= 8) score++;
                if (password.length >= 12) score++;

                // Complexity checks
                if (/[A-Z]/.test(password)) score++;
                if (/[a-z]/.test(password)) score++;
                if (/[0-9]/.test(password)) score++;
                if (/[^A-Za-z0-9]/.test(password)) score++;

                // Determine strength level
                let level = 'weak';
                if (score >= 4) level = 'medium';
                if (score >= 5) level = 'strong';

                // Feedback
                switch(level) {
                    case 'weak':
                        feedback = 'Weak password';
                        break;
                    case 'medium':
                        feedback = 'Medium strength password';
                        break;
                    case 'strong':
                        feedback = 'Strong password';
                        break;
                }

                return { score, level, feedback };
            }

            function updateStrengthMeter(strength) {
                const bars = strengthBars.querySelectorAll('.strength-bar');
                
                // Reset all bars
                bars.forEach(bar => {
                    bar.className = 'strength-bar';
                });

                // Set active bars based on score
                const activeCount = Math.min(strength.score, 5);
                for (let i = 0; i < activeCount; i++) {
                    bars[i].className = `strength-bar ${strength.level}`;
                }

                // Update text
                strengthText.textContent = strength.feedback;
                strengthText.style.color = getStrengthColor(strength.level);
            }

            function getStrengthColor(level) {
                switch(level) {
                    case 'weak': return '#dc2626';
                    case 'medium': return '#f59e0b';
                    case 'strong': return '#059669';
                    default: return '#6b7280';
                }
            }

            function updateSelectedExams() {
                const selected = Array.from(examOptions)
                    .filter(option => option.classList.contains('selected'))
                    .map(option => option.dataset.exam);
                
                selectedExamsInput.value = selected.join(',');
            }

            // Add modal styles if not present
            if (!document.querySelector('#modal-styles')) {
                const style = document.createElement('style');
                style.id = 'modal-styles';
                style.textContent = `
                    .modal {
                        display: none;
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0, 0, 0, 0.5);
                        z-index: 10000;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }

                    .modal.show {
                        display: flex;
                        animation: fadeIn 0.3s ease;
                    }

                    .modal-content {
                        background: white;
                        border-radius: 10px;
                        max-width: 500px;
                        width: 100%;
                        max-height: 90vh;
                        overflow-y: auto;
                    }

                    .modal-sm {
                        max-width: 400px;
                    }

                    .modal-header {
                        padding: 20px 30px;
                        border-bottom: 1px solid #e5e7eb;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    }

                    .modal-header h3 {
                        margin: 0;
                        font-size: 1.25rem;
                        color: #111827;
                    }

                    .modal-close {
                        background: none;
                        border: none;
                        font-size: 1.5rem;
                        color: #6b7280;
                        cursor: pointer;
                        padding: 0;
                        width: 30px;
                        height: 30px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 5px;
                    }

                    .modal-close:hover {
                        background: #f3f4f6;
                        color: #111827;
                    }

                    .modal-body {
                        padding: 30px;
                    }

                    .modal-body p {
                        margin: 0;
                        color: #6b7280;
                        line-height: 1.6;
                    }

                    .modal-footer {
                        padding: 20px 30px;
                        border-top: 1px solid #e5e7eb;
                        display: flex;
                        justify-content: flex-end;
                        gap: 10px;
                    }

                    @keyframes fadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
