<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PDF Practice Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .auth-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .auth-body {
            padding: 40px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .password-input {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 5px;
        }

        .toggle-password:hover {
            color: #374151;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }

        .forgot-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-btn {
            padding: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .auth-btn.loading {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #6b7280;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .auth-divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #2563eb;
            background: #f8fafc;
        }

        .social-btn.google {
            color: #374151;
        }

        .social-btn.google i {
            color: #ea4335;
        }

        .social-btn.github {
            color: #374151;
        }

        .social-btn.github i {
            color: #333;
        }

        .auth-footer {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .auth-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .auth-links a {
            color: #6b7280;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .auth-links a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            justify-content: center;
        }

        .logo i {
            font-size: 2rem;
        }

        @media (max-width: 480px) {
            .auth-body {
                padding: 30px 20px;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF Practice Pro</span>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your account</p>
            </div>

            <div class="auth-body">
                <form class="auth-form" id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" 
                               id="email" 
                               class="form-control" 
                               placeholder="Enter your email"
                               required>
                        <div class="error-message" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" 
                                   id="password" 
                                   class="form-control" 
                                   placeholder="Enter your password"
                                   required>
                            <button type="button" class="toggle-password" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="password-error"></div>
                    </div>

                    <div class="remember-forgot">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" id="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>

                    <div class="auth-divider">
                        <span>Or continue with</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn google" id="google-login">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                        <button type="button" class="social-btn github" id="github-login">
                            <i class="fab fa-github"></i>
                            GitHub
                        </button>
                    </div>

                    <div class="auth-footer">
                        Don't have an account?
                        <a href="register.html">Sign up now</a>
                    </div>
                </form>

                <div class="auth-links">
                    <a href="index.html">Back to Home</a>
                    <a href="help.html">Need Help?</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Enter your email address and we'll send you a link to reset your password.</p>
                <div class="form-group" style="margin-top: 20px;">
                    <label for="reset-email">Email Address</label>
                    <input type="email" 
                           id="reset-email" 
                           class="form-control" 
                           placeholder="Enter your email">
                    <div class="error-message" id="reset-email-error"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancel-reset">Cancel</button>
                <button class="btn btn-primary" id="send-reset-link">Send Reset Link</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const loginBtn = document.getElementById('login-btn');
            const forgotPasswordBtn = document.getElementById('forgot-password');
            const forgotModal = document.getElementById('forgot-modal');
            const cancelResetBtn = document.getElementById('cancel-reset');
            const sendResetBtn = document.getElementById('send-reset-link');
            const resetEmailInput = document.getElementById('reset-email');
            const googleLoginBtn = document.getElementById('google-login');
            const githubLoginBtn = document.getElementById('github-login');

            // Check if user is already logged in
            if (PDFPracticePro.isAuthenticated()) {
                window.location.href = 'dashboard.html';
            }

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });

            // Forgot password modal
            forgotPasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                forgotModal.classList.add('show');
            });

            cancelResetBtn.addEventListener('click', function() {
                forgotModal.classList.remove('show');
            });

            // Close modal on outside click
            forgotModal.addEventListener('click', function(e) {
                if (e.target === forgotModal) {
                    forgotModal.classList.remove('show');
                }
            });

            // Send reset link
            sendResetBtn.addEventListener('click', async function() {
                const email = resetEmailInput.value.trim();
                
                if (!email) {
                    showError('reset-email-error', 'Please enter your email address');
                    return;
                }

                if (!isValidEmail(email)) {
                    showError('reset-email-error', 'Please enter a valid email address');
                    return;
                }

                try {
                    sendResetBtn.disabled = true;
                    sendResetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

                    const response = await PDFPracticePro.makeRequest('/auth/forgot-password', 'POST', {
                        email: email
                    });

                    if (response && response.success) {
                        PDFPracticePro.showNotification('Password reset link sent to your email', 'success');
                        forgotModal.classList.remove('show');
                        resetEmailInput.value = '';
                    }
                } catch (error) {
                    showError('reset-email-error', error.message || 'Failed to send reset link');
                } finally {
                    sendResetBtn.disabled = false;
                    sendResetBtn.innerHTML = 'Send Reset Link';
                }
            });

            // Social login buttons
            googleLoginBtn.addEventListener('click', function() {
                PDFPracticePro.showNotification('Google login coming soon!', 'info');
            });

            githubLoginBtn.addEventListener('click', function() {
                PDFPracticePro.showNotification('GitHub login coming soon!', 'info');
            });

            // Form validation
            emailInput.addEventListener('input', function() {
                clearError('email-error');
            });

            passwordInput.addEventListener('input', function() {
                clearError('password-error');
            });

            // Form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Validate form
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                let isValid = true;

                // Clear previous errors
                clearError('email-error');
                clearError('password-error');

                // Validate email
                if (!email) {
                    showError('email-error', 'Email is required');
                    isValid = false;
                } else if (!isValidEmail(email)) {
                    showError('email-error', 'Please enter a valid email address');
                    isValid = false;
                }

                // Validate password
                if (!password) {
                    showError('password-error', 'Password is required');
                    isValid = false;
                } else if (password.length < 6) {
                    showError('password-error', 'Password must be at least 6 characters');
                    isValid = false;
                }

                if (!isValid) return;

                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

                try {
                    // Call login API
                    const response = await PDFPracticePro.makeRequest('/auth/login', 'POST', {
                        email: email,
                        password: password
                    });

                    if (response && response.success) {
                        // Save token and user data
                        localStorage.setItem('auth_token', response.token);
                        localStorage.setItem('user_data', JSON.stringify(response.user));

                        // Save remember me preference
                        const rememberMe = document.getElementById('remember-me').checked;
                        if (!rememberMe) {
                            // If not remember me, use sessionStorage for temporary storage
                            sessionStorage.setItem('auth_token', response.token);
                            sessionStorage.setItem('user_data', JSON.stringify(response.user));
                        }

                        // Show success message
                        PDFPracticePro.showNotification('Login successful!', 'success');

                        // Redirect to dashboard
                        setTimeout(() => {
                            const redirectUrl = getRedirectUrl();
                            window.location.href = redirectUrl;
                        }, 1000);
                    }
                } catch (error) {
                    // Show error message
                    const errorElement = error.message.includes('email') ? 'email-error' : 'password-error';
                    showError(errorElement, error.message || 'Invalid email or password');
                    
                    // Reset button
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            });

            // Helper functions
            function showError(elementId, message) {
                const element = document.getElementById(elementId);
                element.textContent = message;
                element.classList.add('show');
            }

            function clearError(elementId) {
                const element = document.getElementById(elementId);
                element.textContent = '';
                element.classList.remove('show');
            }

            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }

            function getRedirectUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                return redirect || 'dashboard.html';
            }

            // Add modal styles if not present
            if (!document.querySelector('#modal-styles')) {
                const style = document.createElement('style');
                style.id = 'modal-styles';
                style.textContent = `
                    .modal {
                        display: none;
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0, 0, 0, 0.5);
                        z-index: 10000;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }

                    .modal.show {
                        display: flex;
                        animation: fadeIn 0.3s ease;
                    }

                    .modal-content {
                        background: white;
                        border-radius: 10px;
                        max-width: 500px;
                        width: 100%;
                        max-height: 90vh;
                        overflow-y: auto;
                    }

                    .modal-sm {
                        max-width: 400px;
                    }

                    .modal-header {
                        padding: 20px 30px;
                        border-bottom: 1px solid #e5e7eb;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    }

                    .modal-header h3 {
                        margin: 0;
                        font-size: 1.25rem;
                        color: #111827;
                    }

                    .modal-close {
                        background: none;
                        border: none;
                        font-size: 1.5rem;
                        color: #6b7280;
                        cursor: pointer;
                        padding: 0;
                        width: 30px;
                        height: 30px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 5px;
                    }

                    .modal-close:hover {
                        background: #f3f4f6;
                        color: #111827;
                    }

                    .modal-body {
                        padding: 30px;
                    }

                    .modal-body p {
                        margin: 0;
                        color: #6b7280;
                        line-height: 1.6;
                    }

                    .modal-footer {
                        padding: 20px 30px;
                        border-top: 1px solid #e5e7eb;
                        display: flex;
                        justify-content: flex-end;
                        gap: 10px;
                    }

                    @keyframes fadeIn {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
        });
    </script>
</body>
</html>
